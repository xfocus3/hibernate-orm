name: HHH-20763 publish verified review fix
on:
  push:
    branches: [sandcastle/hhh20763-review-20261110]
    paths: [.github/workflows/hhh20763-publish.yml]
permissions:
  contents: write
concurrency:
  group: hhh20763-reviewed-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: be02e527f354927d44075ede78e839c96d7c389e
      PATCH_COMMIT: 086752f72243d0ce6761f0ece47df772d51e2d13
      VERIFIED_TREE: 8cdce2b87d5d8ba8bacf0628aac386f89ac403e3
      PR_BRANCH: HHH-20763-primary-key-foreign-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be02e527f354927d44075ede78e839c96d7c389e
          path: source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 086752f72243d0ce6761f0ece47df772d51e2d13
          path: request
          persist-credentials: false
      - name: Reconstruct the independently verified GREEN tree
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = xfocus3/hibernate-orm
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C request rev-parse HEAD)" = "$PATCH_COMMIT"
          echo '6d4746f18fa1ec2b5f370e4508c29d37639c9f876883a41870c160923ef8898f  request/patches/hhh20763-green.patch' | sha256sum --check
          git -C source apply --check ../request/patches/hhh20763-green.patch
          git -C source apply --index ../request/patches/hhh20763-green.patch
          git -C source diff --cached --check
          git -C source diff --exit-code
          test "$(git -C source write-tree)" = "$VERIFIED_TREE"
          python3 - <<'PYCODE'
          import json, os, subprocess
          expected = ["hibernate-core/src/main/java/org/hibernate/boot/model/internal/BinderHelper.java", "hibernate-core/src/main/java/org/hibernate/boot/model/internal/ToOneBinder.java", "hibernate-core/src/test/java/org/hibernate/boot/model/internal/AssociationOverrideForeignKeyResolverTest.java", "hibernate-core/src/test/java/org/hibernate/orm/test/constraint/AssociationOverrideForeignKeyTest.java"]
          actual = subprocess.check_output(["git", "-C", "source", "diff", "--cached", "--name-only", os.environ["EXPECTED_HEAD"]], text=True).splitlines()
          assert sorted(actual) == sorted(expected), actual
          PYCODE
          printf 'Reconstructed GREEN tree %s. RED run 43011428105; GREEN run 43011824377. Their ZIP digests, XML, pinned patches and unchanged formatter trees were independently inspected before this publication. No tests are rerun by this job.\n' "$VERIFIED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only to the unchanged PR branch
        working-directory: source
        run: |
          set -euo pipefail
          current="$(git ls-remote --exit-code origin "refs/heads/$PR_BRANCH" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD"
          git config user.name "$(git show -s --format=%an "$EXPECTED_HEAD")"
          git config user.email "$(git show -s --format=%ae "$EXPECTED_HEAD")"
          git commit -m 'HHH-20763 Resolve nested association override foreign keys'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$VERIFIED_TREE"
          test -z "$(git status --porcelain)"
          git push origin "$candidate:refs/heads/$PR_BRANCH"
          published="$(git ls-remote --exit-code origin "refs/heads/$PR_BRANCH" | cut -f1)"
          test "$published" = "$candidate"
          printf 'Published commit %s to %s with exact verified tree %s.\n' "$published" "$PR_BRANCH" "$VERIFIED_TREE" >> "$GITHUB_STEP_SUMMARY"
