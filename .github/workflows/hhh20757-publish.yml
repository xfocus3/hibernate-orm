name: HHH-20757 publish verified review fix
on:
  push:
    branches: [sandcastle/hhh20757-review-20261110]
    paths: [.github/workflows/hhh20757-publish.yml]
permissions:
  contents: write
concurrency:
  group: hhh20757-reviewed-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: a4e2a8669f52054ba29dbd6f06542071a5020650
      PATCH_COMMIT: 67093c30d405af376bf519e46059a8f8b1f6776a
      VERIFIED_TREE: f181e37de2b61c5529e071295a7aa7f132f70619
      PR_BRANCH: fix-HHH-20757-enhanced-versioned-persist
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4e2a8669f52054ba29dbd6f06542071a5020650
          path: source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 67093c30d405af376bf519e46059a8f8b1f6776a
          path: request
          persist-credentials: false
      - name: Reconstruct the independently verified GREEN tree
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = xfocus3/hibernate-orm
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C request rev-parse HEAD)" = "$PATCH_COMMIT"
          echo 'ed4872c872004677e799c19863e6a2235bc939efeadfd226aae140ee3dc6e2a1  request/patches/hhh20757-tracker-green.patch' | sha256sum --check
          git -C source apply --check ../request/patches/hhh20757-tracker-green.patch
          git -C source apply --index ../request/patches/hhh20757-tracker-green.patch
          git -C source diff --cached --check
          git -C source diff --exit-code
          test "$(git -C source write-tree)" = "$VERIFIED_TREE"
          python3 - <<'PYCODE'
          import json, os, subprocess
          expected = ["hibernate-core/src/main/java/org/hibernate/persister/entity/AbstractEntityPersister.java", "hibernate-core/src/test/java/org/hibernate/orm/test/bytecode/enhancement/dirty/MutableVersionDirtyTrackingTest.java"]
          actual = subprocess.check_output(["git", "-C", "source", "diff", "--cached", "--name-only", os.environ["EXPECTED_HEAD"]], text=True).splitlines()
          assert sorted(actual) == sorted(expected), actual
          PYCODE
          printf 'Reconstructed GREEN tree %s. RED run 43015279770; GREEN run 43015368836. Their ZIP digests, XML, pinned patches and unchanged formatter trees were independently inspected before this publication. No tests are rerun by this job.\n' "$VERIFIED_TREE" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only to the unchanged PR branch
        working-directory: source
        run: |
          set -euo pipefail
          current="$(git ls-remote --exit-code origin "refs/heads/$PR_BRANCH" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD"
          git config user.name "$(git show -s --format=%an "$EXPECTED_HEAD")"
          git config user.email "$(git show -s --format=%ae "$EXPECTED_HEAD")"
          git commit -m 'HHH-20757 Preserve mapped mutable version dirtiness'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$VERIFIED_TREE"
          test -z "$(git status --porcelain)"
          git push origin "$candidate:refs/heads/$PR_BRANCH"
          published="$(git ls-remote --exit-code origin "refs/heads/$PR_BRANCH" | cut -f1)"
          test "$published" = "$candidate"
          printf 'Published commit %s to %s with exact verified tree %s.\n' "$published" "$PR_BRANCH" "$VERIFIED_TREE" >> "$GITHUB_STEP_SUMMARY"
