name: Prepare reviewed HHH-20417 publication
on:
  push:
    branches: [sandcastle/hhh20417-publication-20261107]
    paths: [.github/workflows/hhh20417-publication.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: hhh-20417-publication-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2b3cb99d1a72024a804d8d58de966f4a2c1cb7c
          path: target
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 44672f379293f4f36e8391a4d5979a53adaf99a6
          path: request
          persist-credentials: false
      - name: Verify completed RED and GREEN run identities
        uses: actions/github-script@v7
        with:
          script: |
            for (const [id, sha, conclusion] of [[42683468261, '51b798d693af58ed4e53d89d26820684f2d1af6f', 'failure'], [42684728549, '3847e9a3162bd37f49a960b2800f68512bce39d4', 'success']]) {
              const run = (await github.rest.actions.getWorkflowRun({owner: 'xfocus3', repo: 'hibernate-orm', run_id: id})).data;
              if (run.status !== 'completed' || run.conclusion !== conclusion || run.head_sha !== sha || run.path !== '.github/workflows/hhh20417-final-fork.yml' || run.run_attempt !== 1) throw new Error('Unexpected verification run identity or result: ' + id);
            }
      - uses: actions/download-artifact@v4
        with:
          name: java-verification-42683468261
          run-id: 42683468261
          github-token: ${{ github.token }}
          path: red
      - uses: actions/download-artifact@v4
        with:
          name: java-verification-42684728549
          run-id: 42684728549
          github-token: ${{ github.token }}
          path: green
      - name: Verify open PR and unchanged fork head
        uses: actions/github-script@v7
        with:
          script: |
            const pr = (await github.rest.pulls.get({owner: 'hibernate', repo: 'hibernate-orm', pull_number: 13881})).data;
            if (pr.state !== 'open' || pr.merged || pr.user.login !== 'xfocus3' || pr.head.repo.full_name !== 'xfocus3/hibernate-orm' || pr.head.ref !== '8.0-HHH-20417-immediate-pessimistic-increment' || pr.head.sha !== 'b2b3cb99d1a72024a804d8d58de966f4a2c1cb7c') throw new Error('Official PR or source head changed');
      - name: Inspect XML counts, provenance, and formatter delta
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re, subprocess, xml.etree.ElementTree as ET
          base = 'b2b3cb99d1a72024a804d8d58de966f4a2c1cb7c'
          patch_commit = '44672f379293f4f36e8391a4d5979a53adaf99a6'
          for name, expected in [('custom-persister-red.patch', 'b0726be9479361f32b25457a7d73e6051b1c8a910c7c9229c488e73d7625e2dd'), ('maintainer-followup.patch', '9fbd15f5cee3b38abfdab900ca1186d3734da6bbd9e4f5cfe0435df6f68a75f5')]:
              assert hashlib.sha256(pathlib.Path('request/patches', name).read_bytes()).hexdigest() == expected
          provenance = {}
          for side in ['red', 'green']:
              text = pathlib.Path(side, 'verification.txt').read_text()
              print(side.upper() + '_PROVENANCE ' + text.replace(chr(10), ' '))
              provenance[side] = dict(line.split('=', 1) for line in text.splitlines() if '=' in line)
              assert provenance[side]['base'] == base and provenance[side]['patch_commit'] == patch_commit
          red_xml, = pathlib.Path('red').rglob('TEST-org.hibernate.orm.test.locking.ForceIncrementCustomPersisterTest.xml')
          red_root = ET.parse(red_xml).getroot()
          failed = [t for t in red_root.iter('testcase') if t.find('failure') is not None]
          assert int(red_root.get('tests')) == 2 and int(red_root.get('failures')) == 1 and int(red_root.get('errors')) == 0
          assert len(failed) == 1 and failed[0].get('name').startswith('testOptimisticIncrementUsesCustomOverride')
          print('RED_FAILURE ' + failed[0].get('name') + ' ' + failed[0].find('failure').get('message', ''))
          totals = dict.fromkeys(['tests', 'failures', 'errors', 'skipped'], 0)
          for path in pathlib.Path('green').rglob('TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          print('GREEN_TOTALS ' + str(totals))
          assert totals['tests'] > 250 and totals['failures'] == 0 and totals['errors'] == 0
          green_xml, = pathlib.Path('green').rglob('TEST-org.hibernate.orm.test.locking.ForceIncrementCustomPersisterTest.xml')
          cases = list(ET.parse(green_xml).getroot().iter('testcase'))
          assert len(cases) == 2 and all(t.find('failure') is None and t.find('error') is None and t.find('skipped') is None for t in cases)
          print('GREEN_CUSTOM_PERSISTER ' + str([t.get('name') for t in cases]))
          def git(*args):
              return subprocess.check_output(['git', '-C', 'target', *args], text=True).strip()
          original = pathlib.Path('request/patches/maintainer-followup.patch')
          git('apply', '--check', str(original.resolve()))
          git('apply', '--index', str(original.resolve()))
          candidate_tree = git('write-tree')
          assert candidate_tree == provenance['green']['tree']
          git('apply', '--reverse', '--index', str(original.resolve()))
          git('apply', '--index', str(pathlib.Path('green/verified.patch').resolve()))
          tested_tree = git('write-tree')
          assert tested_tree == provenance['green']['tested_tree']
          git('diff', '--cached', '--check')
          expected_paths = {b for a, b in re.findall(r'^diff --git a/(.*?) b/(.*?)$', original.read_text(), re.M)}
          assert set(git('diff', '--cached', '--name-only').splitlines()) == expected_paths
          print('TESTED_TREE ' + tested_tree)
          print('TESTED_DIFF_STAT ' + git('diff', '--cached', '--stat'))
          print('FORMATTER_DELTA ' + git('diff', candidate_tree, tested_tree))
          PY
      - name: Publish the reviewed and validated follow-up
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b2b3cb99d1a72024a804d8d58de966f4a2c1cb7c
          test "$(git write-tree)" = 1e64f66c8a294653c76ac6ac36334485c28328f3
          git diff --cached --check
          publication_ref=refs/heads/8.0-HHH-20417-immediate-pessimistic-increment
          publication_base=$(git ls-remote --heads origin "$publication_ref" | cut -f1)
          test "$publication_base" = b2b3cb99d1a72024a804d8d58de966f4a2c1cb7c
          git config user.name xfocus3
          git config user.email xfocus29@gmail.com
          git commit -m "HHH-20417 Preserve persister overrides and guard locking regressions"
          test "$(git show -s --format='%an <%ae>|%cn <%ce>')" = 'xfocus3 <xfocus29@gmail.com>|xfocus3 <xfocus29@gmail.com>'
          test "$(git show -s --format=%T HEAD)" = 1e64f66c8a294653c76ac6ac36334485c28328f3
          publication_auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$publication_auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $publication_auth" push origin "HEAD:$publication_ref"
          test "$(git ls-remote --heads origin "$publication_ref" | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'PUBLISHED_HEAD=%s\n' "$(git rev-parse HEAD)"
