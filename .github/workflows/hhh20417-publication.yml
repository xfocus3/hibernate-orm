name: Prepare reviewed HHH-20417 publication
on:
  push:
    branches: [sandcastle/hhh20417-publication-20261107]
    paths: [.github/workflows/hhh20417-publication.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: hhh-20417-publication-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xfocus3/hibernate-work
          ref: 30e07c88a192526493bfcfed0a9729407726e6dc
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 99489d519a023b37cb83c1a89b73ae499113e089
          fetch-depth: 0
          path: target
          persist-credentials: false
      - name: Verify tested evidence and original branch lease
        uses: actions/github-script@v7
        with:
          script: |
            const checked = (await github.rest.actions.getWorkflowRun({ owner: 'xfocus3', repo: 'hibernate-work', run_id: 42412488514 })).data;
            if (checked.status !== 'completed' || checked.conclusion !== 'success' || checked.head_sha !== '30e07c88a192526493bfcfed0a9729407726e6dc' || checked.path !== '.github/workflows/hhh20417-check.yml' || checked.run_attempt !== 1) throw new Error('Exact evidence run not successful');
            const work = (await github.rest.pulls.get({ owner: 'xfocus3', repo: 'hibernate-work', pull_number: 51 })).data;
            if (work.state !== 'open' || work.head.sha !== 'e8ee28ce9db90c242487d6ab20d9f6383cfbf2d5') throw new Error('Reviewed work PR changed');
            const review = (await github.rest.actions.getWorkflowRun({ owner: 'xfocus3', repo: 'hibernate-work', run_id: 42413900771 })).data;
            if (review.status !== 'completed' || review.conclusion !== 'success') throw new Error('Original review is not successful');
      - name: Publish only reviewed source checkpoint
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git apply --check ../evidence/patches/HHH-20417.patch
          git apply --index ../evidence/patches/HHH-20417.patch
          test "$(git write-tree)" = 'bb14a3b475008746a591fbdf1215e180ddea44b4'
          git diff --cached --check
          git config user.name xfocus3
          git config user.email xfocus29@gmail.com
          git commit -m "HHH-20417 Execute pessimistic force increments immediately"
          test "$(git show -s --format='%an <%ae>|%cn <%ce>')" = 'xfocus3 <xfocus29@gmail.com>|xfocus3 <xfocus29@gmail.com>'
          ref=refs/heads/8.0-HHH-20417-immediate-pessimistic-increment
          test -z "$(git ls-remote --heads origin "$ref")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force-with-lease="$ref:" origin "HEAD:$ref"
          git rev-parse HEAD
