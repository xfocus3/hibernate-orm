name: Prepare reviewed HHH-21073 publication
on:
  push:
    branches: [sandcastle/hhh21073-publication-20261107]
permissions:
  contents: write
  actions: read
concurrency:
  group: hhh-21073-publication-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xfocus3/hibernate-work
          ref: a03c2ee95050a549a0bf4f6b5de70d89b2a8ea6b
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a27b439b2dc96cf0bd0bf8f76ab33ff6d5664b25
          fetch-depth: 0
          path: target
          persist-credentials: false
      - name: Verify tested evidence and original branch lease
        uses: actions/github-script@v7
        with:
          script: |
            const checked = (await github.rest.actions.getWorkflowRun({ owner: 'xfocus3', repo: 'hibernate-work', run_id: 42400594115 })).data;
            if (checked.status !== 'completed' || checked.conclusion !== 'success' || checked.head_sha !== 'a03c2ee95050a549a0bf4f6b5de70d89b2a8ea6b' || checked.path !== '.github/workflows/hhh21073-check.yml' || checked.run_attempt !== 1) throw new Error('Exact evidence run not successful');
            const work = (await github.rest.pulls.get({ owner: 'xfocus3', repo: 'hibernate-work', pull_number: 49 })).data;
            if (work.state !== 'open' || work.head.sha !== '5227b22b97bd04af7d9fdf0603599b31b2bce245') throw new Error('Reviewed work PR changed');
            const review = (await github.rest.actions.getWorkflowRun({ owner: 'xfocus3', repo: 'hibernate-work', run_id: 42402412259 })).data;
            if (review.status !== 'completed' || review.conclusion !== 'success') throw new Error('Original review is not successful');
      - name: Publish only reviewed source checkpoint
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git apply --check ../evidence/patches/HHH-21073.patch
          git apply --index ../evidence/patches/HHH-21073.patch
          test "$(git write-tree)" = 'ec873322703920ff1f106abad7107c8f3ce1ab6a'
          git diff --cached --check
          git config user.name xfocus3
          git config user.email xfocus29@gmail.com
          git commit -m "HHH-21073 Preserve nullable key pagination boundaries"
          test "$(git show -s --format='%an <%ae>|%cn <%ce>')" = 'xfocus3 <xfocus29@gmail.com>|xfocus3 <xfocus29@gmail.com>'
          ref=refs/heads/8.0-HHH-21073-nullable-key-pagination
          test -z "$(git ls-remote --heads origin "$ref")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force-with-lease="$ref:" origin "HEAD:$ref"
          git rev-parse HEAD
